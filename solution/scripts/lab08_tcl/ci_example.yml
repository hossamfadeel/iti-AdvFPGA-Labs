# Lab08 Part 5: GitHub Actions gate around the tested build.tcl
name: lab08-ci
on: [push, pull_request]
jobs:
  synth:
    runs-on: [self-hosted, vivado]
    steps:
      - uses: actions/checkout@v4
      - run: ./run_gate_test.sh
      - uses: actions/upload-artifact@v4
        with: { name: reports, path: build/*.rpt }
